<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>laga layang</title>
  <meta name="description" content="Single-player competitive kite fighting game">
  <style>
    @font-face {
      font-family: 'ChipMug';
      src: url('assets/ChipMug.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0d0d0d;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'ChipMug', monospace;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      image-rendering: auto;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>

  <script src="phaser.min.js"></script>
  <script src="embed-adapter.js"></script>
  <script>window.addEventListener('contextmenu', (e) => e.preventDefault());</script>
  <script src="game.js"></script>
</body>

</html>
